<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>F3 Kata dihindari</title>
<link rel="stylesheet" href="frame.css"><script src="map.js"></script>
<style>
  .rule { position: absolute; left: 72px; top: 700px; display: flex; gap: 14px; flex-wrap: wrap; z-index: 4; }
  .chip { font-family: var(--mono); font-weight: 800; font-size: 32px; padding: 12px 20px; border-radius: 999px; background: var(--cap-bg); color: var(--cap-fg); }
  .chip.k { background: var(--card); color: var(--ink); }
  .chip.x { background: var(--card); color: var(--alarm); border: 4px solid var(--alarm); display: inline-flex; align-items: center; gap: 10px; }
  .chip.x::before { content: ""; width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--alarm); background: linear-gradient(45deg, transparent 44%, var(--alarm) 44% 56%, transparent 56%); }
  .funnel { position: absolute; left: 0; top: 820px; width: 1080px; height: 520px; z-index: 1; }
  .funnel .body { fill: var(--card); stroke: var(--gain-fg); }
  .funnel .rim { stroke: var(--reply); }
  .in { position: absolute; width: 190px; height: 92px; border-radius: 20px; background: var(--card); box-shadow: 0 8px 20px rgba(0,0,0,.12); padding: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
  .in .bar { height: 16px; } .in .bar + .bar { width: 60%; }
  .bad { position: absolute; left: 70px; top: 1040px; transform: rotate(-16deg); z-index: 3; background: var(--card); border-radius: 20px; padding: 18px 24px; box-shadow: 0 12px 30px rgba(0,0,0,.2); font-family: var(--display); font-weight: 800; font-size: 56px; color: var(--alarm); text-decoration: line-through; text-decoration-thickness: 8px; }
  .reply { position: absolute; left: 270px; top: 1300px; width: 540px; background: var(--you); border-radius: 36px 36px 8px 36px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.2); z-index: 3; }
  .reply .bar { background: rgba(255,255,255,.6); height: 22px; }
  .reply .bar:nth-child(2) { width: 82%; } .reply .bar:nth-child(3) { width: 46%; }
  .reply .cur { position: absolute; right: 40px; bottom: 30px; width: 6px; height: 40px; background: #fff; }
</style></head>
<body class="s-gain">
<div class="cap"><span class="sm">KATA YANG KAMU HINDARI, CONTOH:</span><span>LOKER</span></div>
<div class="rule"><span class="chip k">Bogor</span><span class="chip x">loker</span></div>
<svg class="funnel" viewBox="0 0 1080 520">
  <path class="body" d="M150 70 H930 L630 360 V470 H450 V360 Z" stroke-width="8" stroke-linejoin="round"/>
  <path class="rim" d="M200 100 H880" stroke-width="6" stroke-dasharray="18 14"/>
</svg>
<div class="in" style="left:200px;top:840px"><div class="bar"></div><div class="bar"></div></div>
<div class="in" style="left:445px;top:820px"><div class="bar"></div><div class="bar"></div></div>
<div class="in" style="left:690px;top:850px"><div class="bar"></div><div class="bar"></div></div>
<div class="in" style="left:445px;top:1050px;transform:scale(.8)"><div class="bar"></div><div class="bar"></div></div>
<div class="bad">loker</div>
<div class="reply"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="cur"></div></div>
<div class="safe"></div>
</body></html>
